<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Meet Interpreter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-4">
                <i class="fas fa-robot mr-2"></i>AI Google Meet Interpreter
            </h1>
            <p class="text-gray-400">Live Translation & TTS Powered by Groq</p>
        </header>

        <div class="bg-gray-800 rounded-xl shadow-2xl p-6 mb-8 border border-gray-700">
            <div class="bg-blue-900/40 border border-blue-500 rounded-lg p-6 text-center">
                <h3 class="text-lg font-semibold text-white mb-2">Opción Bot en la Nube (Railway)</h3>
                <p class="text-sm text-gray-300 mb-4">El bot se unirá a la llamada y leerá los subtítulos por ti.</p>
                <div class="flex max-w-md mx-auto gap-2">
                    <input type="text" id="meetUrl" placeholder="https://meet.google.com/xxx-xxxx-xxx" 
                           class="flex-1 bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                    <button id="joinBtn" onclick="joinMeet('bot')"
                            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                        Invitar Bot
                    </button>
                </div>
            </div>
            <p id="status" class="mt-4 text-sm text-gray-400 flex items-center gap-2">
                <i class="fas fa-circle text-red-500"></i> Disconnected
            </p>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <!-- Original Captions -->
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 h-[400px] flex flex-col">
                <h2 class="text-xl font-semibold mb-4 text-gray-300 border-b border-gray-700 pb-2">
                    <i class="fas fa-closed-captioning mr-2"></i>Original Text
                </h2>
                <div id="originalBox" class="flex-1 overflow-y-auto space-y-3 font-mono text-sm text-gray-400">
                    <!-- Captions go here -->
                </div>
            </div>

            <!-- Translated Text -->
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 h-[400px] flex flex-col">
                <h2 class="text-xl font-semibold mb-4 text-blue-400 border-b border-gray-700 pb-2">
                    <i class="fas fa-language mr-2"></i>Translation (Spanish)
                </h2>
                <div id="translatedBox" class="flex-1 overflow-y-auto space-y-3 text-lg">
                    <!-- Translations go here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let audioQueue = [];
        let isPlaying = false;

        function connectWebSocket() {
            ws = new WebSocket((window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws');
            
            ws.onmessage = async function(event) {
                const data = JSON.parse(event.data);
                
                if (data.type === 'status') {
                    const statusEl = document.getElementById('status');
                    statusEl.innerHTML = '<i class="fas fa-circle text-green-500"></i> ' + data.message;
                }
                else if (data.type === 'caption') {
                    const box = document.getElementById('originalBox');
                    box.innerHTML += '<div class="p-2 bg-gray-900 rounded border-l-2 border-gray-600">' + data.text + '</div>';
                    box.scrollTop = box.scrollHeight;
                }
                else if (data.type === 'translation') {
                    const box = document.getElementById('translatedBox');
                    box.innerHTML += '<div class="p-3 bg-blue-900/30 rounded-lg border-l-4 border-blue-500">' + data.text + '</div>';
                    box.scrollTop = box.scrollHeight;
                }
                else if (data.type === 'audio') {
                    // data.audio is base64
                    audioQueue.push('data:audio/mp3;base64,' + data.audio);
                    playNextAudio();
                }
            };
            
            ws.onclose = () => {
                document.getElementById('status').innerHTML = '<i class="fas fa-circle text-red-500"></i> Disconnected. Retrying...';
                setTimeout(connectWebSocket, 3000);
            };
        }

        async function playNextAudio() {
            if (isPlaying || audioQueue.length === 0) return;
            isPlaying = true;
            
            const audioSrc = audioQueue.shift();
            const audio = new Audio(audioSrc);
            
            audio.onended = () => {
                isPlaying = false;
                playNextAudio();
            };
            
            try {
                await audio.play();
            } catch (e) {
                console.error("Audio playback failed (browser auto-play policy?):", e);
                isPlaying = false;
                playNextAudio();
            }
        }

        function joinMeet(mode) {
            const url = document.getElementById('meetUrl').value;
            if (mode === 'bot' && !url) return alert('Enter a Meet URL for the bot to join');
            
            document.getElementById('joinBtn').disabled = true;
            const localBtn = document.getElementById('localBtn');
            if (localBtn) localBtn.disabled = true;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({action: 'join', url: url, mode: mode}));
            }
        }

        // Initialize
        connectWebSocket();
    </script>
</body>
</html>
