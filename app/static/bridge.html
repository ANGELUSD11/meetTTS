<!DOCTYPE html>
<html>
<head>
    <title>Bridge</title>
</head>
<body>
    <script>
        const wsUrl = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws';
        let ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            window.parent.postMessage({type: 'status', message: '✅ Escuchando subtítulos'}, '*');
            ws.send(JSON.stringify({action: 'join', mode: 'bookmarklet'}));
        };

        ws.onclose = () => {
            window.parent.postMessage({type: 'status', message: '❌ Desconectado'}, '*');
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'audio') {
                // Forward to bookmarklet to bypass iframe autoplay policy
                window.parent.postMessage({type: 'audio', audio: data.audio}, '*');
            }
        };

        window.addEventListener('message', (event) => {
            if (event.data && event.data.action === 'caption') {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify(event.data));
                }
            }
        });
    </script>
</body>
</html>
